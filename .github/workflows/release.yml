name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          yes | sdkmanager --licenses > /dev/null || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Configure Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_dir="src-tauri/gen/android/app"
          mkdir -p "$keystore_dir"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_dir/release.jks"
            cat > "$keystore_dir/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          elif [ -f "src-tauri/otium-scan-release.jks" ]; then
            cp src-tauri/otium-scan-release.jks "$keystore_dir/release.jks"
            cat > "$keystore_dir/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=otiumscan123
          keyAlias=otium_scan
          keyPassword=otiumscan123
          EOF
          fi

      - name: Build Android APK (Per-ABI Split for minimal file size)
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          # Build APK split per architecture for ultra-lightweight binaries
          npx tauri android build --apk --split-per-abi

      - name: Package Release Assets & Checksums
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release

          echo "Searching for generated release APKs..."
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"

          # Distribute lightweight per-architecture APKs (arm64-v8a, armeabi-v7a, x86_64)
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            name="$(basename "$apk")"
            dir="$(basename "$(dirname "$(dirname "$apk")")")"
            abi=""
            case "$dir" in
              arm64*) abi="arm64-v8a" ;;
              arm*) abi="armeabi-v7a" ;;
              x86_64*) abi="x86_64" ;;
              x86*) abi="x86" ;;
              *)
                case "$name" in
                  *arm64-v8a*) abi="arm64-v8a" ;;
                  *armeabi-v7a*) abi="armeabi-v7a" ;;
                  *x86_64*) abi="x86_64" ;;
                  *x86*) abi="x86" ;;
                  *arm64*) abi="arm64-v8a" ;;
                  *arm*) abi="armeabi-v7a" ;;
                esac
                ;;
            esac
            if [ -n "$abi" ]; then
              echo "Packaging $apk as OtiumScan_${VERSION}_${abi}.apk"
              cp "$apk" "release/OtiumScan_${VERSION}_${abi}.apk"
            else
              echo "Skipping unrecognised APK: $apk"
            fi
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk")

          cd release
          if ls *.apk 1> /dev/null 2>&1; then
            sha256sum *.apk > SHA256SUMS.txt
            echo "Successfully generated APK release assets:"
            ls -lh *.apk
          else
            echo "Warning: No per-architecture APKs matched the pattern, searching all APKs:"
            find ../src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} ./ \;
            sha256sum *.apk > SHA256SUMS.txt || true
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [verify, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release

      - name: Extract Release Notes
        id: notes
        shell: bash
        run: |
          if [ -f "release-notes.md" ]; then
            cat release-notes.md > RELEASE_BODY.md
          else
            echo "Release ${{ needs.verify.outputs.tag }} of Otium Scan." > RELEASE_BODY.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Otium Scan ${{ needs.verify.outputs.version }}
          body_path: RELEASE_BODY.md
          files: |
            release/*
          draft: false
          prerelease: false
          make_latest: true
