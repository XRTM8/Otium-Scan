name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing SDK packages (attempt $attempt/3)..."
            if sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"; then
              echo "SDK packages installed successfully."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Error: Failed to install Android SDK packages after 3 attempts."
              exit 1
            fi
            echo "sdkmanager download interrupted. Retrying in 5s..."
            sleep 5
          done
          yes | sdkmanager --licenses > /dev/null || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Configure Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_dir="src-tauri/gen/android/app"
          mkdir -p "$keystore_dir"

          # Never fall back to an unsigned build. An unsigned APK is not
          # installable on any device, and publishing one silently is worse
          # than failing the release.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error ::ANDROID_KEYSTORE_BASE64 is missing. Refusing to build an unsigned release APK."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error ::ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS are missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_dir/release.jks"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > "$keystore_dir/keystore.properties"

          # Prove the keystore is readable and the alias exists before building.
          keytool -list \
            -keystore "$keystore_dir/release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "Keystore ready: alias $ANDROID_KEY_ALIAS"

      - name: Build Android APK (Per-ABI Split for minimal file size)
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          # Build APK split per architecture for ultra-lightweight binaries
          npx tauri android build --apk --split-per-abi

      - name: Package Release Assets & Checksums
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release

          echo "Searching for generated release APKs..."
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"

          # Distribute lightweight per-architecture APKs (arm64-v8a, armeabi-v7a, x86_64)
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            name="$(basename "$apk")"
            dir="$(basename "$(dirname "$(dirname "$apk")")")"
            abi=""
            case "$dir" in
              arm64*) abi="arm64-v8a" ;;
              arm*) abi="armeabi-v7a" ;;
              x86_64*) abi="x86_64" ;;
              x86*) abi="x86" ;;
              *)
                case "$name" in
                  *arm64-v8a*) abi="arm64-v8a" ;;
                  *armeabi-v7a*) abi="armeabi-v7a" ;;
                  *x86_64*) abi="x86_64" ;;
                  *x86*) abi="x86" ;;
                  *arm64*) abi="arm64-v8a" ;;
                  *arm*) abi="armeabi-v7a" ;;
                esac
                ;;
            esac
            if [ -n "$abi" ]; then
              echo "Packaging $apk as OtiumScan_${VERSION}_${abi}.apk"
              cp "$apk" "release/OtiumScan_${VERSION}_${abi}.apk"
            else
              echo "Skipping unrecognised APK: $apk"
            fi
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk")

          cd release
          if ! ls *.apk 1> /dev/null 2>&1; then
            echo "::error ::No release APKs were produced. Refusing to publish an empty or unsigned release."
            exit 1
          fi
          sha256sum *.apk > SHA256SUMS.txt
          echo "Successfully generated APK release assets:"
          ls -lh *.apk

      - name: Verify APKs (signature, key, version, ABI, 16 KB alignment)
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 || 'f4b17cd06e1658964fc9e7bd3b82c6e2220b07a403eef95401e2984c13342ed0' }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-apk.mjs \
            --expect-cert "$EXPECTED_CERT" \
            --expect-version "$VERSION" \
            release/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [verify, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release

      - name: Extract Release Notes
        id: notes
        shell: bash
        run: |
          if [ -f "release-notes.md" ]; then
            cat release-notes.md > RELEASE_BODY.md
          else
            echo "Release ${{ needs.verify.outputs.tag }} of Otium Scan." > RELEASE_BODY.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Otium Scan ${{ needs.verify.outputs.version }}
          body_path: RELEASE_BODY.md
          files: |
            release/*
          draft: false
          prerelease: false
          make_latest: true
