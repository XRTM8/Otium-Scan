[package]
name = "otium-scan"
version = "1.0.4"
description = "A private, distraction-free document scanner"
authors = ["XRTM8"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "otium_scan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "s"
